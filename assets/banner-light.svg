<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">Lucas Pinheiro Alves - SRE / DevOps Engineer</title>
  <desc id="d">Terminal-style card: kubectl describe engineer lucas, status Ready, and a 30-day status bar with one incident followed by a post-mortem.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #ffffff; }
    .bar { fill: #f6f8fa; }
    .border { fill: none; stroke: #d0d7de; }
    .prompt { fill: #1a7f37; }
    .cmd { fill: #1f2328; }
    .key { fill: #0969da; }
    .val { fill: #1f2328; }
    .dim { fill: #59636e; }
    .ok { fill: #1a7f37; }
    .warn { fill: #9a6700; }
    .cursor { fill: #1f2328; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="899" height="229" rx="12"/>
  <rect class="border" x="0.5" y="0.5" width="899" height="229" rx="12"/>
  <path class="bar" d="M12.5 0.5h875a12 12 0 0 1 12 12v19.5h-899v-19.5a12 12 0 0 1 12-12z"/>
  <circle cx="22" cy="16" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="16" r="5.5" fill="#28c840"/>
  <text class="mono dim" x="450" y="20.5" font-size="12" text-anchor="middle">lucas@prod: ~</text>

  <g class="mono" font-size="15">
    <text x="24" y="62"><tspan class="prompt">$</tspan><tspan class="cmd"> kubectl describe engineer lucas-pinheiro-alves</tspan></text>
    <text x="24" y="92"><tspan class="key">Role:      </tspan><tspan class="val">SRE / DevOps Engineer · Cloud &amp; Platform</tspan></text>
    <text x="24" y="116"><tspan class="key">Clouds:    </tspan><tspan class="val">AWS · OCI · Azure · GCP</tspan></text>
    <text x="24" y="140"><tspan class="key">Focus:     </tspan><tspan class="val">Kubernetes · IaC · observability · toil reduction</tspan></text>
    <text x="24" y="164"><tspan class="key">Status:    </tspan><tspan class="ok">● Ready</tspan><tspan class="dim">  (10+ years in IT, 5+ in cloud)</tspan></text>
    <text x="24" y="200"><tspan class="prompt">$</tspan><tspan class="cmd"> </tspan></text>
  </g>
  <rect class="cursor" x="42" y="187" width="9" height="17"/>

  <g transform="translate(640 176)">
    <text class="mono dim" x="0" y="-8" font-size="11">last 30 days</text>
    <g class="ok">
      <rect x="0" width="5" height="20" rx="1"/><rect x="8" width="5" height="20" rx="1"/><rect x="16" width="5" height="20" rx="1"/><rect x="24" width="5" height="20" rx="1"/><rect x="32" width="5" height="20" rx="1"/><rect x="40" width="5" height="20" rx="1"/><rect x="48" width="5" height="20" rx="1"/><rect x="56" width="5" height="20" rx="1"/><rect x="64" width="5" height="20" rx="1"/><rect x="72" width="5" height="20" rx="1"/><rect x="80" width="5" height="20" rx="1"/><rect x="88" width="5" height="20" rx="1"/><rect x="96" width="5" height="20" rx="1"/><rect x="104" width="5" height="20" rx="1"/><rect x="112" width="5" height="20" rx="1"/><rect x="120" width="5" height="20" rx="1"/><rect x="128" width="5" height="20" rx="1"/>
      <rect x="144" width="5" height="20" rx="1"/><rect x="152" width="5" height="20" rx="1"/><rect x="160" width="5" height="20" rx="1"/><rect x="168" width="5" height="20" rx="1"/><rect x="176" width="5" height="20" rx="1"/><rect x="184" width="5" height="20" rx="1"/><rect x="192" width="5" height="20" rx="1"/><rect x="200" width="5" height="20" rx="1"/><rect x="208" width="5" height="20" rx="1"/><rect x="216" width="5" height="20" rx="1"/><rect x="224" width="5" height="20" rx="1"/><rect x="232" width="5" height="20" rx="1"/>
    </g>
    <rect class="warn" x="136" width="5" height="20" rx="1"/>
    <text class="mono dim" x="0" y="36" font-size="11">1 incident · 1 post-mortem · 0 repeats</text>
